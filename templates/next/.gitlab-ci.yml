# Builds the site and publishes it with GitLab Pages whenever the default
# branch changes (including every Publish in the admin panel). For nightly
# rebuilds, add a schedule under Build → Pipeline schedules. See README.md.
pages:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/, .next/cache/]
  script:
    # This site must be served from the root of its address. Turn on "Use unique domain" under Deploy → Pages.
    - |
      if [ "$(node -e 'console.log(new URL(process.env.CI_PAGES_URL).pathname)')" != "/" ]; then
        echo "GitLab Pages serves this site from a subfolder ($CI_PAGES_URL), but a Next.js Goodfellow site must be served from the root of its address. Turn on \"Use unique domain\" under Deploy → Pages, or use a custom domain. See README.md."
        exit 1
      fi
    - npm ci --cache .npm --prefer-offline
    - npx next build
  pages:
    publish: out
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
